name: Update Weather Data

on:
  # ההפעלה השעתית מגיעה מ-cron-job.org (משימה "weather-dashboard", בדקה 7 של כל שעה)
  # דרך workflow_dispatch. ה-cron של GitHub הוסר כי הוא דילג על כ-3/4 מהריצות.
  # לא להחזיר schedule במקביל: כל ריצה = 2 בקשות API, והמכסה היא 48 ביום.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Fetch weather data
        env:
          STATION_ID: ${{ secrets.STATION_ID }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          python fetch_weather_final.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add weather-data.json rain_season.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌤️ עדכון נתוני מזג אויר $(date +'%Y-%m-%d %H:%M')" && git push)
