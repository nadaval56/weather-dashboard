name: Update Weather Data

on:
  schedule:
    # רץ כל שעה (48 בקשות/יום = הגבול של Tier 1)
    - cron: '0 * * * *'
  workflow_dispatch:  # מאפשר הרצה ידנית

permissions:
  contents: write

# מבטיח שרק ריצה אחת פעילה בכל רגע נתון. אם מצטברת ריצה חדשה
# (למשל אחרי שריצה קודמת נתקעה ב-queued בגלל מחסור ב-runners),
# הריצה הישנה מבוטלת לטובת החדשה — תמיד רוצים את הנתונים העדכניים
# ביותר, ולעולם לא שתי ריצות שדוחפות ל-git במקביל.
concurrency:
  group: update-weather
  cancel-in-progress: true

jobs:
  update-weather:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Fetch weather data
        env:
          STATION_ID: ${{ secrets.STATION_ID }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          python fetch_weather_final.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add weather-data.json rain_season.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌤️ עדכון נתוני מזג אויר $(date +'%Y-%m-%d %H:%M')" && git push)
